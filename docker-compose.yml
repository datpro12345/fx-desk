# Weekly ABCD. Fill .env first — see docs/docker.md
#
#   docker compose run --rm weekly
#   docker compose run --rm weekly python scripts/run_weekly_abcd.py --skip-fetch
#
services:
  weekly:
    build:
      context: .
      dockerfile: Dockerfile
    image: ff-transform-data:weekly
    env_file:
      - .env
    environment:
      TZ: Asia/Ho_Chi_Minh
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}
      REPORT_LANG: ${REPORT_LANG:-en}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./.env:/app/.env:ro
    working_dir: /app
    init: true
